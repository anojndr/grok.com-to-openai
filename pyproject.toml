[project]
name = "grok-to-openai-api"
version = "0.1.0"
description = "Turn grok.com free accounts into an OpenAI-compatible API using FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "curl-cffi>=0.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "pydantic>=2",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.7",
  "ty>=0.0.78",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
preview = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["accounts", "config", "grok_gateway", "server", "session_store", "statsig", "uploads"]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"
